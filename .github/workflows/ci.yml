name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'version.txt'
      - 'LICENSE'
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon build
